[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsmith-md"
version = "0.1.0"
description = "Mine a repository's actual conventions into an AGENTS.md, with evidence for every rule. No LLM, no network, no config."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Erick Dronski" }]
keywords = ["agents-md", "claude-code", "codex", "cursor", "ai-agents", "conventions", "developer-tools", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/erickdronski/agentsmith"
Issues = "https://github.com/erickdronski/agentsmith/issues"

[project.scripts]
agentsmith = "agentsmith.cli:main"

[tool.setuptools.packages.find]
include = ["agentsmith*"]

[tool.ruff]
# The package targets Python 3.9, so pyupgrade must not propose 3.10+ syntax
# (`X | None`, builtin generics at runtime). Setting this here is the
# difference between a linter that finds real problems and one that produces
# 300 inapplicable suggestions everyone learns to ignore.
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is enforced by review, not by a hard error
  "SIM105",  # contextlib.suppress is not clearer than a two-line try/except
  "RUF001",  # unicode in prose strings is intentional throughout
  "RUF002",
  "RUF003",
  "BLE001",  # blind `except Exception` is deliberate in this codebase: the
             # fail-open handlers exist so a malformed input file degrades one
             # section rather than aborting the run, and narrowing them would
             # defeat the purpose. Each site says so in a comment.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
