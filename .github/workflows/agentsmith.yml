# Drop this into any repository to fail CI when AGENTS.md drifts from reality.
name: AGENTS.md drift

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. actions/checkout fetches one commit by default, and
          # agentsmith derives the commit convention it checks for from git
          # log; with fewer than 10 commits that check silently has nothing
          # to compare.
          fetch-depth: 0
      # Inputs, all optional: path, file (e.g. CLAUDE.md), strict ("true"
      # also fails on stale references and undocumented conventions),
      # python-version.
      - uses: erickdronski/agentsmith@v0
