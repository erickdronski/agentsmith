# Drop this into any repository to fail CI when AGENTS.md drifts from reality.
name: AGENTS.md drift

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Not `pip install agentsmith`: that name on PyPI belongs to an
      # unrelated project. Install from the repository until this is published.
      - run: pip install git+https://github.com/erickdronski/agentsmith
      - name: Check AGENTS.md against the repository
        run: agentsmith --check
